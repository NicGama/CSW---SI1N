<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Abaixo o meu primeiro documento em JavaScript</h1>
    <hr>
    <h2 id="resposta"> AAAAAAAAAAAAAAAAAA </h2>
    <h3 id="label"> se botar algo aqui, ele não aparece</h3>

    <script type="text/JavaScript">
        document.writeln("<h3>Olá, mundo!<h3>");
        window.alert("Olá, mundo");
        document.getElementById("label").innerHTML = "Teste no h3"

        document.getElementById("resposta").innerHTML = window.confirm("Você está gostando do curso?");
    </script>

    <hr>    
    
</body>
</html>
